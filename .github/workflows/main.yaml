name: Create Pull Request and Update Content

on:
  push:
    branches:
      - main
      - develop
      # or other branches you want to trigger the workflow for

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # Step 1: Checkout the repository
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Step 2: Create or modify the content you want to commit
      - name: Generate or modify content
        run: |
          echo "Creating or modifying content..." # Add your script here to generate content
          mkdir -p apim/apimartifacts
          echo "Some content or data" > apim/apimartifacts/example.txt # Modify this as needed

      # Step 3: Commit the changes to the repository
      - name: Commit changes
        run: |
          git config --local user.name "rashmisahoo-developer"
          git config --local user.email "rashmisahoo0108@gmail.com"
          git add .
          git commit -m "chore: generate content and update apimartifacts"
          git push

      # Step 4: Open a pull request using GitHub CLI
      - name: Open pull request using gh CLI
        run: |
          gh pr create \
            --title "chore: update extract from apim instance ${{ env.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}" \
            --body "This PR is auto-generated by GitHub Actions workflow." \
            --base main \
            --head $(git rev-parse --abbrev-ref HEAD) \
            --label extract \
            --label automated-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH: apim/apimartifacts # Path to your artifacts folder
