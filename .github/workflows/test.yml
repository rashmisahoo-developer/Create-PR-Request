name: Manual Workflow Example

on:
  workflow_dispatch:  # This trigger allows manual execution from GitHub UI

jobs:
  simple-job:
    runs-on: ubuntu-latest  # The job will run on a GitHub-hosted Ubuntu runner

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4  # Checks out the repository code

      # Step 2: Print a simple message
      - name: Print Hello World
        run: echo "Hello, world! This workflow was triggered manually."
